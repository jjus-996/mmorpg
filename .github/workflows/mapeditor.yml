name: Build Harita Editörü
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle :mapeditor:assembleDebug --no-daemon
      - name: Publish APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: harita-editoru
          name: Harita Editörü (son derleme)
          files: mapeditor/build/outputs/apk/debug/mapeditor-debug.apk
